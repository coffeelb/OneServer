[PHP]
engine = On
short_open_tag = Off
expose_php = Off
max_execution_time = 30
max_input_time = 60
memory_limit = 256M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
log_errors = On
; 目录必须带版本号（K17）。原来写的是不带版本的 /var/log/php/，而同一份模板集
; 里的 www.conf 用的是 /var/log/php%%PHP_VERSION%%/ —— 那个目录有人建，这个没有，
; 于是 PHP 自身的错误日志根本写不进去，最终落进 FPM 的 catch-all；
; 多版本共存时还分不清是哪个版本写的。
error_log = /var/log/php%%PHP_VERSION%%/php_errors.log
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20
allow_url_fopen = Off
allow_url_include = Off

disable_functions = pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wifcontinued,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_get_handler,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority,pcntl_async_signals,system,exec,shell_exec,passthru,popen,proc_open,show_source

[Session]
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

[Opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=64
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.save_comments=1