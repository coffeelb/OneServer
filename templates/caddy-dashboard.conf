# OneServer 只读 Web面板 —— 由 `oneserver web enable` 生成，改动会在下次 enable 时被覆盖
#
# 监听所有网卡，用密码挡（basic_auth）。密码存在凭据库，键名 web.basic_auth，
# 取回：oneserver secure get web.basic_auth。要不要再套 HTTPS/反代/域名，
# 跟你给其他任何站点做的决定一样，走 oneserver caddy，这里不替你定。
:%%PORT%% {
	root * %%PUBLIC_DIR%%
	file_server

	basic_auth {
		admin %%AUTH_HASH%%
	}

	header {
		X-Content-Type-Options "nosniff"
		X-Frame-Options "DENY"
		Referrer-Policy "no-referrer"
		-Server
	}
}
