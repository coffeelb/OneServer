# OneServer 只读 Web面板 —— 由 `oneserver web enable` 生成，改动会在下次 enable 时被覆盖
#
# 面板不改任何东西，但**只读跟要不要门是两件独立的事**（规范 §1）。门有两种，
# 二选一，不能都没有 —— 由 enable 时那句「面板用密码保护？」决定：
#
#   选是（默认）  监听所有网卡，basic_auth 挡。密码存凭据库，键名 web.basic_auth，
#                 取回：oneserver secure get web.basic_auth
#   选否          不设密码，改用来源限制：站点地址收窄到 127.0.0.1，
#                 或只对指定网段应答、其余一律 403
#
# 要不要再套 HTTPS/反代/域名，跟你给其他任何站点做的决定一样，走 oneserver caddy，
# 这里不替你定。
%%SITE_ADDR%% {
	# 页面与数据分两个根，是因为它们的生命周期不同：
	#
	#   数据在 tmpfs（重启即空，采集器几秒内重建）
	#   页面是模板本身，随程序目录走
	#
	# 页面**直接从模板目录读**，不在数据目录里放副本或链接。副本会在
	# `oneserver update` 换掉 templates/ 之后停在旧版而没有任何迹象；
	# 链接则会随 tmpfs 一起在重启后消失，得再找个东西去重建它。
	# 直接指过去，两个问题一起没有：升级换模板即刻生效，重启不需要谁来补。
	# 匹配器就是**唯一的那一个路径** `/`，所以模板目录里的其余文件一个都不对外
	handle / {
		rewrite * /dashboard.html
		root * %%PAGE_DIR%%
		file_server
	}
	handle {
		root * %%PUBLIC_DIR%%
		file_server
	}
%%GUARD%%
	header {
		X-Content-Type-Options "nosniff"
		X-Frame-Options "DENY"
		Referrer-Policy "no-referrer"
		-Server
	}
}
